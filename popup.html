<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AIMS Schedule Builder</title>
    <style>
        body { 
            width: 450px; 
            padding: 15px; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
            background: #f5f5f5;
        }
        h2 { 
            color: #0d3d19; 
            font-size: 16px; 
            margin: 0; 
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #0d3d19;
        }
        .header img {
            max-width: 32px;
            width: 100%;
            height: auto;
        }
        .settings {
            background: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .settings label {
            font-size: 12px;
            color: #333;
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .settings select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            background: #fafafa;
            cursor: pointer;
        }
        .settings select:focus {
            outline: none;
            border-color: #0d3d19;
        }
        #status { 
            background: #fff; 
            padding: 10px 12px; 
            border-radius: 6px; 
            margin-bottom: 10px; 
            font-size: 13px; 
            color: #333; 
            font-weight: 500;
        }
        .course-list { 
            max-height: 350px; 
            overflow-y: auto; 
            margin-bottom: 10px; 
        }
        .course-item { 
            background: #fff; 
            padding: 12px; 
            border-radius: 6px; 
            margin-bottom: 8px; 
            border-left: 4px solid #0d3d19;
        }
        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .course-item .title { 
            font-weight: 600; 
            color: #0d3d19; 
            font-size: 13px;
        }
        .course-badge {
            background: #e8faf0;
            color: #0d3d19;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }
        .meetings-container {
            margin-top: 6px;
            background: #f8f9fa;
            border-radius: 4px;
            padding: 4px 0;
        }
        .meeting-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            padding: 4px 8px;
            font-size: 11px;
            border-bottom: 1px solid #eee;
        }
        .meeting-detail:last-child {
            border-bottom: none;
        }
        .meeting-type {
            font-weight: 600;
            color: #0d3d19;
            min-width: 40px;
        }
        .meeting-time {
            color: #c62828;
            font-weight: 500;
        }
        .meeting-days {
            color: #2e7d32;
            font-weight: 500;
        }
        .meeting-location {
            color: #555;
        }
        .meeting-date {
            color: #888;
            font-size: 10px;
        }
        .event-preview {
            margin-top: 6px;
            padding: 4px 8px;
            background: #e8faf0;
            border-radius: 4px;
            font-size: 11px;
            color: #0d3d19;
        }
        .event-preview .label {
            font-weight: 600;
            color: #555;
            margin-right: 4px;
        }
        .event-preview .example {
            font-family: monospace;
            font-size: 11px;
            color: #0d3d19;
        }
        .btn { 
            width: 100%; 
            padding: 10px; 
            border: none; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            background: #0d3d19; 
            color: #fff; 
            transition: transform 0.1s, background 0.2s;
        }
        .btn:hover { 
            transform: translateY(-1px); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); 
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
            transform: none;
        }
        .error { 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 13px; 
            display: none; 
            margin-top: 10px;
        }
        .loading { 
            text-align: center; 
            padding: 20px; 
            color: #666; 
        }
        .spinner { 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #0d3d19; 
            border-radius: 50%; 
            width: 30px; 
            height: 30px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 10px; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        .scrollable {
            max-height: 350px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="images/icon.png" alt="AIMS Schedule Exporter">
        <h2>AIMS Schedule Builder</h2>
    </div>
    
    <div class="settings">
        <label for="titleFormat">Calendar Event Title Format:</label>
        <select id="titleFormat">
            <option value="code_name">[Course Code] Course Name</option>
            <option value="name_code">Course Name [Course Code]</option>
            <option value="name_only">Course Name Only</option>
            <option value="code_only">Course Code Only</option>
        </select>
    </div>
    
    <div id="status">Loading schedule...</div>
    <div class="scrollable">
        <div id="courseList" class="course-list"></div>
    </div>
    <button id="downloadIcsBtn" class="btn" disabled>Download .ics</button>
    <div id="error" class="error"></div>
    <script src="popup.js"></script>
</body>
</html>
